# Production stack for the Oracle Cloud VM.
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml (local dev):
#   - backend runs gunicorn via Dockerfile.prod (no source bind-mount, no autoreload)
#   - frontend is a built SPA served by Nginx, which also proxies /api & /media
#   - Postgres port is NOT published to the host (DB stays private)
#   - only the frontend (Nginx) is exposed publicly, on port 80

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    volumes:
      - media_files:/app/media
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/packages/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Read-only access to user uploads so Nginx can serve /media directly.
      - media_files:/usr/share/nginx/media:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  media_files:
