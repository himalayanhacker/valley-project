# Public-facing web server.
#   /            -> React SPA (static files, with client-side routing fallback)
#   /api/        -> Django (gunicorn)
#   /admin/      -> Django admin
#   /static/     -> Django static (served by WhiteNoise inside gunicorn)
#   /media/      -> user uploads, served directly from the shared volume

upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Allow image/media uploads up to 20 MB through the proxy.
    client_max_body_size 20M;

    # --- API + admin -> Django ---
    location /api/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Django/admin static, served by WhiteNoise.
    location /static/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # User-uploaded media, served straight from the shared volume.
    location /media/ {
        alias /usr/share/nginx/media/;
        access_log off;
        expires 7d;
    }

    # --- React SPA ---
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
